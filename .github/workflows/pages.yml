name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Plays every profession in a headless browser and checks a save survives a reload
  # (tests/smoke_test.py). If it fails, the deploy job doesn't run, so the live game
  # stays on the last good build.
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fails if index.html etc. don't match a fresh `node build.js` from src/ (catches hand edits to built files)
      - name: Built files match src/
        run: node tests/check_build.js

      # Fails if the game stores anything in localStorage that Export save would leave behind
      - name: Every save key is exported
        run: node tests/check_save_keys.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Smoke test
        run: python tests/smoke_test.py

  deploy:
    needs: smoke-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
